<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: base(~{::content}, 'Détails du modèle IA', 'admin')}">
<body>
<th:block th:fragment="content">
    <div class="container py-5">
        <div class="carte-admin">
            <h1 class="h3 mb-4">Détails du modèle IA</h1>

            <h2 class="h4" th:text="${modeleIA.nom}"></h2>

            <img th:if="${!#strings.isEmpty(modeleIA.cheminLogo)}"
                 th:src="@{${modeleIA.cheminLogo}}" alt="Logo" width="100" class="my-3">

            <dl class="row mt-3">
                <dt class="col-sm-3">Identifiant</dt>
                <dd class="col-sm-9" th:text="${modeleIA.id}"></dd>

                <dt class="col-sm-3">Nom</dt>
                <dd class="col-sm-9" th:text="${modeleIA.nom}"></dd>

                <dt class="col-sm-3">Fournisseur</dt>
                <dd class="col-sm-9" th:text="${modeleIA.fourniseurIA?.nom}"></dd>

                <dt class="col-sm-3">URL API</dt>
                <dd class="col-sm-9 text-break" th:text="${modeleIA.urlAPI}"></dd>

                <dt class="col-sm-3">Description</dt>
                <dd class="col-sm-9" th:text="${modeleIA.description}"></dd>
            </dl>

            <div class="d-flex gap-2">
                <a class="btn btn-warning"
                   th:href="@{/admin/modeles-ia/{id}/edit(id=${modeleIA.id})}">Modifier</a>
                <a class="btn btn-contour" th:href="@{/admin/modeles-ia}">Retour à la liste</a>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
