
<!DOCTYPE html>
<html lang="fr"
      data-bs-theme="dark"
      xmlns:th="http://www.thymeleaf.org"
      th:fragment="base(content, titre, activePage)">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">

    <title th:text="${titre} + ' – Vinchat.ai'">
        Vinchat.ai
    </title>

    <link rel="icon"
          type="image/svg+xml"
          th:href="@{/img/logo.svg}">

    <!-- Polices -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/vendor/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/vinchat.css}">
    <link rel="stylesheet" th:href="@{/css/chat.css}">

</head>

<body class="d-flex flex-column min-vh-100">

<!-- Header masqué sur l'accueil et la connexion -->
<th:block th:if="${pageConnexion != true}">
    <th:block th:unless="${activePage == 'accueil'}">
        <header th:replace="~{fragments/header :: header(${activePage})}">
        </header>
    </th:block>
</th:block>

<!-- Contenu de la page -->
<main class="chat-page flex-grow-1 d-flex flex-column"
      th:attr="data-lecture-auto=${lectureAuto == true}"
      th:insert="${content}">
    Contenu de la page
</main>

<!-- Footer masqué sur l'accueil et la connexion -->
<th:block th:if="${pageConnexion != true}">
    <th:block th:unless="${activePage == 'accueil'}">
        <footer th:replace="~{fragments/footer :: footer}">
        </footer>
    </th:block>
</th:block>

<!-- JavaScript -->
<script th:src="@{/vendor/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/textToSpeech.js}"></script>

</body>
</html>
