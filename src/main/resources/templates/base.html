<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:fragment="base(content, titre, activePage)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titre} + ' – Vinchat.ai'">Vinchat.ai</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/img/logo.svg}">

    <!-- Polices : Space Grotesk (titres) et Inter (texte) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">

    <link rel="stylesheet" th:href="@{/vendor/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/vinchat.css}">
</head>
<body class="d-flex flex-column min-vh-100">

<header th:replace="~{fragments/header :: header(${activePage})}"></header>

<main class="flex-grow-1 container py-5" th:insert="${content}">
    Contenu de la page
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script th:src="@{/vendor/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
